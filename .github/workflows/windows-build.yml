name: Windows Build

# You asked for a build on every commit. A cold build compiles the whole
# linphone-sdk from source and can take hours, so `concurrency` below cancels an
# in-flight run as soon as a newer commit lands instead of queueing them up.
on:
  push:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows installer (MSVC 2022)
    # The project supports Visual Studio 2022 only (README.md "Specific
    # instructions for the Windows platform"). If GitHub retires this label,
    # switch to windows-2025 -- it still ships VS 2022.
    runs-on: windows-2022
    # 360 is the hard ceiling GitHub allows on hosted runners; we cannot ask for more.
    timeout-minutes: 360

    env:
      BUILD_DIR: build-desktop
      BUILD_TYPE: RelWithDebInfo
      QT_VERSION: 6.10.0
      # Flattened mirror of linphone-sdk to bypass gitlab.linphone.org's connection drops.
      SDK_MIRROR: https://github.com/26th-Official/linphone-sdk-mirror.git
      SDK_MIRROR_REF: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Fetch linphone-sdk from mirror
        shell: bash
        run: |
          set -euo pipefail
          # The SDK and its ~31 nested submodules have been flattened into one repo
          # hosted at SDK_MIRROR. That mirror is disposable and regenerated on demand
          # with .github/scripts/mirror-linphone-sdk.sh whenever the pinned SDK commit
          # in external/linphone-sdk changes.
          git clone --depth 1 --branch "$SDK_MIRROR_REF" "$SDK_MIRROR" external/linphone-sdk
          echo "SDK mirror cloned ($(git -C external/linphone-sdk rev-parse --short HEAD))"

          # Fail here, not an hour into the compile. A mirror regenerated badly can look
          # complete while key dependencies are empty directories -- that exact failure
          # produced three unusable mirrors, so check for real files, not for existence.
          # NOTE: no `| head` in these pipelines -- head closes the pipe after N lines,
          # find gets SIGPIPE, and under pipefail the whole step dies (exit 141).
          fail=0
          for d in external/mbedtls external/srtp external/libvpx external/speex \
                   external/openldap external/xerces-c external/opus external/zlib \
                   bcg729 bcmatroska2; do
            n=$(find "external/linphone-sdk/$d" -type f 2>/dev/null | wc -l)
            if [ "$n" -eq 0 ]; then echo "::error::SDK mirror missing content: $d"; fail=1; fi
          done
          [ "$fail" -eq 0 ] || { echo "::error::Regenerate the mirror with .github/scripts/mirror-linphone-sdk.sh"; exit 1; }
          echo "SDK mirror content verified"

      - name: Report disk space
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        # Real-time scanning of every object file costs 20-30% on a large C++ build.
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          foreach ($proc in 'cl.exe', 'link.exe', 'ninja.exe', 'cmake.exe', 'makensis.exe') {
            Add-MpPreference -ExclusionProcess $proc
          }

      - name: Set up MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        # The SDK wrapper generators need these (README.md build dependencies).
        run: python -m pip install --upgrade pip pystache six

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtnetworkauth qtshadertools
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install MSYS2 build tools
        shell: pwsh
        run: |
          # makensis builds the installer; the rest are SDK third-party build
          # requirements listed under ENABLE_WINDOWS_TOOLS_CHECK in the README.
          # make/meson/ninja are installed explicitly rather than left to the SDK's own
          # tools check: that check runs during configure, i.e. after the verification
          # step below, so a missing tool would surface as a late failure instead of a
          # fast one. libvpx and openh264 are Makefile builds; dav1d/aom use meson.
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed `
            mingw-w64-x86_64-nsis `
            mingw-w64-x86_64-yasm `
            mingw-w64-x86_64-nasm `
            mingw-w64-x86_64-meson `
            mingw-w64-x86_64-ninja `
            make perl gawk bzip2 sed patch pkg-config gettext intltool

      - name: Configure environment (Qt6_DIR and MSYS2 on PATH)
        shell: pwsh
        run: |
          # PATH order has to satisfy four competing requirements:
          #   1. sh AND bash must be real POSIX shells. System32 ships WSL launchers
          #      (bash.exe/wsl.exe) and this image has WSL with NO distro, so libvpx's
          #      gen_msvs_def.sh (shebang: #!/bin/bash) dies with "Windows Subsystem for
          #      Linux has no installed distributions". The SDK hardcodes the literal
          #      "sh" in ExternalDependencies.cmake, so PATH is the only lever.
          #   2. sh/bash and make should come from the SAME MSYS2 runtime. Mixing Git for
          #      Windows' msys-2.0.dll with C:\msys64's can abort with a cygheap mismatch
          #      when make forks a shell.
          #   3. powershell.exe must be Windows PowerShell (System32), never an MSYS2 stub.
          #   4. python must stay the setup-python one (it has pystache/six installed),
          #      not MSYS2's -- so its directory is pinned ahead of MSYS2.
          #   5. msys64\mingw64\bin holds gcc/cc/c++. It must NOT precede the MSVC paths:
          #      aom is an ExternalProject whose nested CMake does its own compiler probe
          #      and forwards no compiler, so it picked cc.exe (GNU 16.1.0) and produced
          #      libaom.a -- GNU naming that MSVC cannot link ("cannot open file
          #      OUTPUT\lib\aom.lib"). usr\bin (sh/bash/make/perl/sed) is safe to lead;
          #      mingw64\bin is appended so nasm/yasm/meson still resolve.
          $py     = Split-Path (Get-Command python).Source
          $msysu  = "C:\msys64\usr\bin"
          $msysm  = "C:\msys64\mingw64\bin;C:\msys64"
          $sys32  = "$env:SystemRoot\system32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$py;$msysu;$sys32;$env:PATH;$msysm"
          Add-Content -Path $env:GITHUB_ENV -Value "Qt6_DIR=$env:QT_ROOT_DIR\lib\cmake\Qt6"

          # ExternalProjects run their own nested CMake and do not inherit our
          # -DCMAKE_C_COMPILER flags. CC/CXX are honoured by CMake's compiler probe, so
          # setting them here pins MSVC for every nested configure even if some future
          # PATH change puts a gcc back in front.
          Add-Content -Path $env:GITHUB_ENV -Value "CC=cl"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=cl"

          # These steps run under pwsh (PowerShell 7), which sets PSModulePath to PS7's
          # module directories. CMake inherits that, then rnnoise invokes Windows
          # PowerShell 5.1 (`powershell -Command "Get-FileHash ..."`), which cannot find
          # its own Microsoft.PowerShell.Utility module under PS7 paths -- so Get-FileHash
          # resolves to nothing, the computed hash is empty, and the checksum check aborts.
          # Listing the 5.1 module paths first makes autoloading work for both hosts.
          $psmod = @(
            "$env:SystemRoot\system32\WindowsPowerShell\v1.0\Modules",
            "$env:ProgramFiles\WindowsPowerShell\Modules",
            "$env:ProgramFiles\PowerShell\7\Modules"
          ) -join ';'
          Add-Content -Path $env:GITHUB_ENV -Value "PSModulePath=$psmod"

      - name: Neutralize GNU link.exe (shadows the MSVC linker under meson)
        shell: pwsh
        run: |
          # dav1d is built with meson, driven by a generated /bin/sh script whose PATH is
          # simply `export PATH="$PATH"` (linphone-sdk cmake/ExternalDependencies.cmake:317),
          # i.e. it inherits whatever the shell set up. Both Git-for-Windows and MSYS2 ship
          # a GNU link.exe (the POSIX link(1) utility) in usr/bin, and their sh prepends its
          # own usr/bin to PATH -- so meson finds GNU link.exe and aborts with
          # "Found GNU link.exe instead of MSVC link.exe".
          # Reordering PATH cannot fix this: whichever sh wins puts its own usr/bin first.
          # Renaming the offender is the standard remedy; nothing in this build uses link(1).
          $renamed = 0
          foreach ($d in "$env:ProgramFiles\Git\usr\bin", 'C:\msys64\usr\bin') {
            $l = Join-Path $d 'link.exe'
            if (Test-Path $l) {
              Move-Item $l (Join-Path $d 'link-gnu.exe') -Force
              Write-Host "renamed $l -> link-gnu.exe"
              $renamed++
            }
          }
          Write-Host "GNU link.exe copies neutralized: $renamed"

      - name: Verify toolchain resolution
        shell: pwsh
        run: |
          # Fail in seconds if PATH ordering is wrong, rather than mid-configure.
          $ps = (Get-Command powershell.exe).Source
          Write-Host "powershell resolves to: $ps"
          if ($ps -like "*msys64*") {
            Write-Host "::error::MSYS2 powershell shadows Windows PowerShell; Get-FileHash would fail"
            exit 1
          }
          # Assert these resolve to MSVC positively. An earlier version only rejected
          # msys64 paths, which let Git's usr/bin GNU link.exe through and broke the
          # dav1d meson configure ~15 minutes into the run.
          foreach ($t in 'link.exe','cl.exe') {
            $p = (Get-Command $t -EA SilentlyContinue).Source
            Write-Host "$t resolves to: $p"
            if (-not $p) { Write-Host "::error::$t not found on PATH"; exit 1 }
            if ($p -notmatch 'VC\\Tools\\MSVC') {
              Write-Host "::error::$t resolves to '$p', not the MSVC toolchain"
              exit 1
            }
          }
          # Meson resolves the linker through /bin/sh, which prepends its own usr/bin.
          # Confirm no GNU link.exe survives in either shell's bin directory.
          foreach ($d in "$env:ProgramFiles\Git\usr\bin", 'C:\msys64\usr\bin') {
            $l = Join-Path $d 'link.exe'
            if (Test-Path $l) {
              Write-Host "::error::GNU link.exe still present at $l; meson will pick it over MSVC"
              exit 1
            }
          }
          Write-Host "No GNU link.exe shadowing the MSVC linker"
          # POSIX shells: sh is used by the SDK's generated EP_*.sh scripts, bash by
          # libvpx's gen_msvs_def.sh (#!/bin/bash). Both must be real shells from the
          # SAME msys2 runtime as make, not WSL launchers out of System32.
          foreach ($t in 'sh.exe','bash.exe','make.exe') {
            $p = (Get-Command $t -EA SilentlyContinue).Source
            Write-Host "$t resolves to: $p"
            if (-not $p) { Write-Host "::error::$t not found on PATH"; exit 1 }
            if ($p -like "*\System32\*") {
              Write-Host "::error::$t is the WSL shim at $p; libvpx/dav1d will fail"
              exit 1
            }
            if ($p -notlike "*msys64*") {
              Write-Host "::error::$t resolves to $p, not the msys64 runtime; mixing runtimes risks a cygheap mismatch"
              exit 1
            }
          }
          # Prove the shells execute, rather than merely existing.
          foreach ($s in 'sh','bash') {
            $probe = & $s -c 'echo shellworks'
            if ($probe -ne 'shellworks') {
              Write-Host "::error::$s did not execute correctly (got '$probe')"
              exit 1
            }
          }
          Write-Host "sh/bash/make all resolve to msys64 and execute"
          # No GNU compiler may precede MSVC. ExternalProjects (aom) run a nested CMake
          # that probes the compiler itself and forwards none of our -D flags: it found
          # C:/msys64/mingw64/bin/cc.exe (GNU 16.1.0) and emitted libaom.a instead of
          # aom.lib, so the mediastreamer2 link failed 1546 targets in.
          $msvcDir = Split-Path (Get-Command cl.exe).Source
          foreach ($t in 'cc.exe','gcc.exe','c++.exe','g++.exe') {
            $p = (Get-Command $t -EA SilentlyContinue).Source
            if ($p) {
              Write-Host "$t resolves to: $p"
              $gnuIdx  = $env:PATH.ToLower().IndexOf((Split-Path $p).ToLower())
              $msvcIdx = $env:PATH.ToLower().IndexOf($msvcDir.ToLower())
              if ($gnuIdx -ge 0 -and $msvcIdx -ge 0 -and $gnuIdx -lt $msvcIdx) {
                Write-Host "::error::$t at $p precedes MSVC on PATH; nested ExternalProject CMake will build GNU-named libs"
                exit 1
              }
            }
          }
          Write-Host "No GNU compiler precedes MSVC on PATH"
          # python must be the setup-python one; MSYS2's lacks pystache/six, which the
          # SDK's wrapper generators import.
          $pyp = (Get-Command python.exe -EA SilentlyContinue).Source
          Write-Host "python resolves to: $pyp"
          if ($pyp -like "*msys64*") {
            Write-Host "::error::python resolves into msys64; pystache/six will be missing"
            exit 1
          }
          python -c "import pystache, six; print('python modules OK')"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pystache/six missing from the active python"; exit 1 }
          # Assembler/codec tools the SDK checks via linphone_sdk_check_is_installed().
          # Resolved without forcing .exe: MSYS2 ships some of these (meson especially)
          # as wrapper scripts rather than plain executables.
          foreach ($t in 'nasm','yasm','perl','sed','meson','ninja','7z') {
            $p = (Get-Command $t -EA SilentlyContinue | Select-Object -First 1).Source
            if (-not $p) { Write-Host "::error::$t not found on PATH (SDK requires it)"; exit 1 }
            Write-Host "$t resolves to: $p"
          }
          # Probe Get-FileHash exactly as rnnoise does -- through cmake's execute_process,
          # not directly from pwsh. A direct call succeeds even when the nested one fails,
          # because the environment CMake hands to its child differs from this shell's.
          @'
          execute_process(
            COMMAND powershell -Command "Get-FileHash -Algorithm SHA256 '$ENV{SystemRoot}/notepad.exe' | Select-Object -ExpandProperty Hash"
            OUTPUT_VARIABLE H OUTPUT_STRIP_TRAILING_WHITESPACE)
          if(H STREQUAL "")
            message(FATAL_ERROR "Get-FileHash returned nothing via execute_process; rnnoise checksum would fail")
          endif()
          message(STATUS "Get-FileHash via cmake works: ${H}")
          '@ | Set-Content -Path probe.cmake -Encoding utf8
          cmake -P probe.cmake
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::rnnoise checksum verification will fail"; exit 1 }
          Remove-Item probe.cmake

      - name: Configure
        shell: pwsh
        run: |
          # Both the SDK and the app derive their version from `git describe`, which needs
          # annotated tags. The SDK mirror is a flattened single-commit snapshot with no
          # tags, so bctoolbox's bc_compute_full_version() aborts with "fail to get GIT
          # describe version". Passing the versions explicitly takes the documented
          # override path (`if(NOT LINPHONESDK_VERSION)`) and skips git entirely.
          # Keep LINPHONESDK_VERSION in step with the pinned SDK commit in
          # external/linphone-sdk; both must be plain semver for bc_parse_full_version.
          # Every -D argument is quoted: PowerShell's native-argument parser mangles
          # unquoted dotted values, turning -DLINPHONESDK_VERSION=5.5.0 into "5" plus a
          # stray ".5.0" path. Upstream hit the same class of bug (see the Invoke-Expression
          # comment in .gitlab-ci-files/windows-desktop.yml).
          cmake -S . -B $env:BUILD_DIR -G Ninja `
            "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE" `
            "-DCMAKE_C_COMPILER=cl" "-DCMAKE_CXX_COMPILER=cl" "-DCMAKE_RC_COMPILER=rc" `
            "-DLINPHONESDK_VERSION=5.5.0" `
            "-DLINPHONEAPP_VERSION=6.2.0" `
            "-DENABLE_APP_PACKAGING=YES" `
            "-DENABLE_WINDOWS_TOOLS_CHECK=ON" `
            "-DENABLE_CRASH_HANDLER=OFF" `
            "-DENABLE_UNIT_TESTS=OFF" `
            "-DENABLE_TESTS=OFF" `
            "-DENABLE_TESTS_COMPONENTS=OFF" `
            "-DENABLE_TOOLS=OFF" `
            "-DENABLE_DOC=OFF" `
            "-DENABLE_GPL_THIRD_PARTIES=OFF" `
            "-DCMAKE_BUILD_PARALLEL_LEVEL=4"

      - name: Build and install
        shell: pwsh
        run: |
          $start = Get-Date
          cmake --build $env:BUILD_DIR --target install --parallel 4
          # Printed so we can tune the workflow against a real number rather than a guess.
          Write-Host "Build duration: $((Get-Date) - $start)"

      - name: Report disk space after build
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: linphone-windows-installer
          # packaging.cmake.in copies the NSIS installer into OUTPUT/Packages.
          path: ${{ env.BUILD_DIR }}/OUTPUT/Packages/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload CMake logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: |
            ${{ env.BUILD_DIR }}/CMakeCache.txt
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.BUILD_DIR }}/CMakeFiles/*.log
          if-no-files-found: ignore
          retention-days: 7
