name: Windows Build

# You asked for a build on every commit. A cold build compiles the whole
# linphone-sdk from source and can take hours, so `concurrency` below cancels an
# in-flight run as soon as a newer commit lands instead of queueing them up.
on:
  push:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows installer (MSVC 2022)
    # The project supports Visual Studio 2022 only (README.md "Specific
    # instructions for the Windows platform"). If GitHub retires this label,
    # switch to windows-2025 -- it still ships VS 2022.
    runs-on: windows-2022
    # 360 is the hard ceiling GitHub allows on hosted runners; we cannot ask for more.
    timeout-minutes: 360

    env:
      BUILD_DIR: build-desktop
      BUILD_TYPE: RelWithDebInfo
      QT_VERSION: 6.10.0
      # Flattened mirror of linphone-sdk to bypass gitlab.linphone.org's connection drops.
      SDK_MIRROR: https://github.com/26th-Official/linphone-sdk-mirror.git
      SDK_MIRROR_REF: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Fetch linphone-sdk from mirror
        shell: bash
        run: |
          set -euo pipefail
          # The SDK and its ~31 nested submodules have been flattened into one repo
          # hosted at SDK_MIRROR. That mirror is disposable and regenerated on demand
          # with .github/scripts/mirror-linphone-sdk.sh whenever the pinned SDK commit
          # in external/linphone-sdk changes.
          git clone --depth 1 --branch "$SDK_MIRROR_REF" "$SDK_MIRROR" external/linphone-sdk
          echo "SDK mirror cloned ($(git -C external/linphone-sdk rev-parse --short HEAD))"

          # Fail here, not an hour into the compile. A mirror regenerated badly can look
          # complete while key dependencies are empty directories -- that exact failure
          # produced three unusable mirrors, so check for real files, not for existence.
          # NOTE: no `| head` in these pipelines -- head closes the pipe after N lines,
          # find gets SIGPIPE, and under pipefail the whole step dies (exit 141).
          fail=0
          for d in external/mbedtls external/srtp external/libvpx external/speex \
                   external/openldap external/xerces-c external/opus external/zlib \
                   bcg729 bcmatroska2; do
            n=$(find "external/linphone-sdk/$d" -type f 2>/dev/null | wc -l)
            if [ "$n" -eq 0 ]; then echo "::error::SDK mirror missing content: $d"; fail=1; fi
          done
          [ "$fail" -eq 0 ] || { echo "::error::Regenerate the mirror with .github/scripts/mirror-linphone-sdk.sh"; exit 1; }
          echo "SDK mirror content verified"

      - name: Report disk space
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        # Real-time scanning of every object file costs 20-30% on a large C++ build.
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          foreach ($proc in 'cl.exe', 'link.exe', 'ninja.exe', 'cmake.exe', 'makensis.exe') {
            Add-MpPreference -ExclusionProcess $proc
          }

      - name: Set up MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        # The SDK wrapper generators need these (README.md build dependencies).
        run: python -m pip install --upgrade pip pystache six

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtnetworkauth qtshadertools
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install MSYS2 build tools
        shell: pwsh
        run: |
          # makensis builds the installer; the rest are SDK third-party build
          # requirements listed under ENABLE_WINDOWS_TOOLS_CHECK in the README.
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed `
            mingw-w64-x86_64-nsis `
            mingw-w64-x86_64-yasm `
            mingw-w64-x86_64-nasm `
            perl gawk bzip2 sed patch pkg-config gettext intltool

      - name: Configure environment (Qt6_DIR and MSYS2 on PATH)
        shell: pwsh
        run: |
          # MSYS2 is APPENDED, never prepended, for two reasons:
          #   - it ships link.exe, which would shadow the MSVC linker;
          #   - it ships a `powershell` stub, which would shadow Windows PowerShell.
          # rnnoise/CMakeLists.txt verifies its model download with
          # `powershell -Command "Get-FileHash ..."`. If the MSYS2 stub wins, Get-FileHash
          # does not exist, the computed hash is empty, and the checksum check aborts
          # configure with a blank "computed:" value.
          # System32 is placed first explicitly so the real powershell.exe always wins,
          # regardless of how the runner image happens to order PATH.
          $sys32 = "$env:SystemRoot\system32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $msys  = "C:\msys64\mingw64\bin;C:\msys64;C:\msys64\usr\bin"
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$sys32;$env:PATH;$msys"
          Add-Content -Path $env:GITHUB_ENV -Value "Qt6_DIR=$env:QT_ROOT_DIR\lib\cmake\Qt6"

          # These steps run under pwsh (PowerShell 7), which sets PSModulePath to PS7's
          # module directories. CMake inherits that, then rnnoise invokes Windows
          # PowerShell 5.1 (`powershell -Command "Get-FileHash ..."`), which cannot find
          # its own Microsoft.PowerShell.Utility module under PS7 paths -- so Get-FileHash
          # resolves to nothing, the computed hash is empty, and the checksum check aborts.
          # Listing the 5.1 module paths first makes autoloading work for both hosts.
          $psmod = @(
            "$env:SystemRoot\system32\WindowsPowerShell\v1.0\Modules",
            "$env:ProgramFiles\WindowsPowerShell\Modules",
            "$env:ProgramFiles\PowerShell\7\Modules"
          ) -join ';'
          Add-Content -Path $env:GITHUB_ENV -Value "PSModulePath=$psmod"

      - name: Verify toolchain resolution
        shell: pwsh
        run: |
          # Fail in seconds if PATH ordering is wrong, rather than mid-configure.
          $ps = (Get-Command powershell.exe).Source
          Write-Host "powershell resolves to: $ps"
          if ($ps -like "*msys64*") {
            Write-Host "::error::MSYS2 powershell shadows Windows PowerShell; Get-FileHash would fail"
            exit 1
          }
          foreach ($t in 'link.exe','cl.exe') {
            $p = (Get-Command $t -EA SilentlyContinue).Source
            Write-Host "$t resolves to: $p"
            if ($p -like "*msys64*") { Write-Host "::error::MSYS2 $t shadows the MSVC toolchain"; exit 1 }
          }
          # Probe Get-FileHash exactly as rnnoise does -- through cmake's execute_process,
          # not directly from pwsh. A direct call succeeds even when the nested one fails,
          # because the environment CMake hands to its child differs from this shell's.
          @'
          execute_process(
            COMMAND powershell -Command "Get-FileHash -Algorithm SHA256 '$ENV{SystemRoot}/notepad.exe' | Select-Object -ExpandProperty Hash"
            OUTPUT_VARIABLE H OUTPUT_STRIP_TRAILING_WHITESPACE)
          if(H STREQUAL "")
            message(FATAL_ERROR "Get-FileHash returned nothing via execute_process; rnnoise checksum would fail")
          endif()
          message(STATUS "Get-FileHash via cmake works: ${H}")
          '@ | Set-Content -Path probe.cmake -Encoding utf8
          cmake -P probe.cmake
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::rnnoise checksum verification will fail"; exit 1 }
          Remove-Item probe.cmake

      - name: Configure
        shell: pwsh
        run: |
          # Both the SDK and the app derive their version from `git describe`, which needs
          # annotated tags. The SDK mirror is a flattened single-commit snapshot with no
          # tags, so bctoolbox's bc_compute_full_version() aborts with "fail to get GIT
          # describe version". Passing the versions explicitly takes the documented
          # override path (`if(NOT LINPHONESDK_VERSION)`) and skips git entirely.
          # Keep LINPHONESDK_VERSION in step with the pinned SDK commit in
          # external/linphone-sdk; both must be plain semver for bc_parse_full_version.
          # Every -D argument is quoted: PowerShell's native-argument parser mangles
          # unquoted dotted values, turning -DLINPHONESDK_VERSION=5.5.0 into "5" plus a
          # stray ".5.0" path. Upstream hit the same class of bug (see the Invoke-Expression
          # comment in .gitlab-ci-files/windows-desktop.yml).
          cmake -S . -B $env:BUILD_DIR -G Ninja `
            "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE" `
            "-DCMAKE_C_COMPILER=cl" "-DCMAKE_CXX_COMPILER=cl" "-DCMAKE_RC_COMPILER=rc" `
            "-DLINPHONESDK_VERSION=5.5.0" `
            "-DLINPHONEAPP_VERSION=6.2.0" `
            "-DENABLE_APP_PACKAGING=YES" `
            "-DENABLE_WINDOWS_TOOLS_CHECK=ON" `
            "-DENABLE_CRASH_HANDLER=OFF" `
            "-DENABLE_UNIT_TESTS=OFF" `
            "-DENABLE_TESTS=OFF" `
            "-DENABLE_TESTS_COMPONENTS=OFF" `
            "-DENABLE_TOOLS=OFF" `
            "-DENABLE_DOC=OFF" `
            "-DENABLE_GPL_THIRD_PARTIES=OFF" `
            "-DCMAKE_BUILD_PARALLEL_LEVEL=4"

      - name: Build and install
        shell: pwsh
        run: |
          $start = Get-Date
          cmake --build $env:BUILD_DIR --target install --parallel 4
          # Printed so we can tune the workflow against a real number rather than a guess.
          Write-Host "Build duration: $((Get-Date) - $start)"

      - name: Report disk space after build
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: linphone-windows-installer
          # packaging.cmake.in copies the NSIS installer into OUTPUT/Packages.
          path: ${{ env.BUILD_DIR }}/OUTPUT/Packages/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload CMake logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: |
            ${{ env.BUILD_DIR }}/CMakeCache.txt
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.BUILD_DIR }}/CMakeFiles/*.log
          if-no-files-found: ignore
          retention-days: 7
